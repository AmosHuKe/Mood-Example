name: moodexample
description: 管理自己的情绪，记录当下所见所想。
publish_to: 'none'
version: 1.9.15+506

environment:
  sdk: 3.14.0
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # l10n
    sdk: flutter

  # 基础
  intl: 0.20.3 # 国际化
  path: 1.9.1
  path_provider: 2.1.6 # 路径
  provider: 6.1.5+1 # 状态管理
  logging: 1.3.0
  go_router: 18.1.4 # 路由管理

  # 存储
  sqflite: 2.4.6 # 数据库
  shared_preferences: 2.5.6 # 共享存储

  # 功能/集成
  excel_plus: 2.29.3 # Excel
  share_plus: 13.3.1 # 分享
  file_picker: 13.4.0 # 文件选择
  webview_flutter: 4.14.1 # WebView
  awesome_notifications: 0.12.1 # 本地通知
  ditredi: 2.0.2 # 3D 数据集显示

  # UI
  material_ui: 1.11.1
  cupertino_ui: 1.1.7
  flutter_zoom_drawer: 3.2.0 # 缩放抽屉
  flutter_smart_dialog: 5.3.1 # Dialog
  table_calendar: # 日历
    git: 
      url: https://github.com/suhail-121/table_calendar
      ref: 4301c4dd6041d2f7a25382261b61b29445e1f54b
  flutter_slidable: 5.2.0 # 滑动操作项
  card_swiper: 3.0.1 # 轮播
  fl_chart: 1.3.1 # 图表
  flutter_screen_lock: 9.2.2+2 # 密码锁
  flutter_tilt: 4.1.0 # 倾斜视差
  remixicon: 4.9.3 # Remixicon

  # 游戏相关
  bonfire: 4.1.3 # 游戏引擎
  flame: 1.38.2 # 游戏引擎

  # 本地认证
  local_auth: 3.0.2 # 本地认证
  local_auth_android: 2.3.0 # Android 本地认证
  local_auth_darwin: 2.0.5 # iOS/macOS 本地认证

  # Dart Hooks
  hooks: 2.2.0
  code_assets: 2.2.0
  native_toolchain_c: 0.19.6

# https://dart.dev/tools/pub/dependencies#dependency-overrides
dependency_overrides:

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: any

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/woolly/
    - assets/3d/city/
    - assets/images/game/mini_fantasy/
    - assets/images/game/mini_fantasy/tiles/
    - assets/images/game/mini_game/
    - assets/images/game/mini_game/tiles/
    - assets/images/game/mini_game/enemy/orc/
    - assets/images/game/mini_game/enemy/boss/
    - assets/images/game/mini_game/player/human/
